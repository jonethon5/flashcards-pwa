<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flashcards</title>
    <meta name="description" content="Flashcards com repetição espaçada, offline, compatível com baralhos do Anki." />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flashcards" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <button id="back" class="bar-btn" data-act="back" hidden aria-label="Voltar">‹ Voltar</button>
        <h1 id="title">Baralhos</h1>
        <div id="bar-actions"></div>
      </header>
      <main id="main"></main>
      <footer id="foot"></footer>
      <nav id="nav">
        <button data-act="nav" data-view="home"><span>▤</span>Baralhos</button>
        <button data-act="nav" data-view="add"><span>＋</span>Adicionar</button>
        <button data-act="nav" data-view="settings"><span>⚙</span>Ajustes</button>
      </nav>
    </div>
    <div id="overlay" hidden><div class="overlay-box"><div class="spinner"></div><p id="overlay-text"></p></div></div>
    <div id="toast" hidden></div>
    <input id="file-apkg" type="file" hidden />
    <input id="file-backup" type="file" hidden />
    <input id="file-image" type="file" accept="image/*" hidden />
    <script type="module" src="js/app.js"></script>
  </body>
</html>
